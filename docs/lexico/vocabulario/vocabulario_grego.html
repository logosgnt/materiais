<!DOCTYPE html>
<html lang="gl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocabulario de Grego</title>

  <style>
    :root {
      --text: #1f1c18;
      --muted: #6f675f;
      --line: rgba(31, 28, 24, 0.12);
      --accent: #7c5c2e;
      --bg: #f6f3ee;
      --max: 900px;
    }

    body {
      margin: 0;
      background: var(--bg);
      font-family: system-ui, sans-serif;
      color: var(--text);
    }

    .page {
      max-width: var(--max);
      margin: auto;
      padding: 2rem 1rem;
    }

    h1 {
      margin-bottom: 1rem;
    }

    #search {
      width: 100%;
      padding: 0.7rem;
      font-size: 1rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    #letters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }

    .letter-chip {
      padding: 0.4rem 0.6rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      cursor: pointer;
      background: white;
    }

    .letter-chip.active {
      background: var(--accent);
      color: white;
    }

    .entry {
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--line);
      line-height: 1.5;
    }

    .greek {
      font-family: "Times New Roman", serif;
      font-weight: bold;
    }

    .meaning {
      color: var(--muted);
    }

    .subs {
      margin: 0.2rem 0 0.4rem 1.2rem;
      padding: 0;
      list-style-type: "– ";
    }

    .subs li {
      color: var(--muted);
      margin: 0.15rem 0;
    }

  </style>
</head>

<body>
  <main class="page">

    <h1>Vocabulario de Grego</h1>

    <input id="search" placeholder="Buscar (logos, anabainw, etc.)">

    <div id="letters"></div>

    <div id="results"></div>

  </main>

  <script src="vocabulario.js"></script>
</body>
</html>
